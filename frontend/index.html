<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlines</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&display=swap">
    <!-- App CSS (variables.css must load first) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layers.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/leaflet-overrides.css">
</head>
<body>

<div id="map"></div>
<div id="progress-wrap">
    <div id="progress-bar"></div>
</div>

<!---- LEFT COLUMN ---->
<div id="left-col">

    <div id="panel-filters" class="island">

        <!-- Section 1: App brand header -->
        <div class="panel-section">
            <div class="app-header">
                <div class="app-name">Spotlines</div>
            </div>
        </div>

        <!-- Section 2: Filters -->
        <div class="panel-section">
            <details class="section-details" open>
                <summary>Filters<span id="filters-hint" class="section-hint" style="display:none"></span></summary>
                <div class="section-body">

                    <!-- Length range slider -->
                    <div>
                        <div class="field-label">
                            Line length <strong id="slider-val">15 – 50 m</strong>
                        </div>
                        <div id="length-slider" style="margin: 8px 6px 4px"></div>
                    </div>

                    <!-- Max slope + Corridor + Water -->
                    <div class="section-row">
                        <div style="flex:2 2 0">
                            <div class="field-label">Max slope</div>
                            <div class="input-wrap">
                                <input type="number" id="maxSlope" class="mini-input" value="5" min="0" max="20"
                                       step="0.5">
                                <span class="input-unit">°</span>
                            </div>
                        </div>
                        <div style="flex:2 2 0">
                            <div class="field-label">Corridor</div>
                            <div class="input-wrap">
                                <input type="number" id="clearanceM" class="mini-input" value="2" min="0" max="20"
                                       step="0.5">
                                <span class="input-unit">m</span>
                            </div>
                        </div>
                        <div style="flex:3 3 0">
                            <div class="field-label">Water</div>
                            <select id="water" class="mini-select" style="width:100%">
                                <option value="any">Any</option>
                                <option value="only">Only</option>
                                <option value="exclude">Exclude</option>
                            </select>
                        </div>
                    </div>

                </div>
            </details>
        </div>

        <!-- Section 3: Line (collapsed by default) -->
        <div class="panel-section">
            <details class="section-details">
                <summary>Line<span id="line-hint" class="section-hint" style="display:none"></span></summary>
                <div class="section-body">

                    <!-- Line type -->
                    <div class="section-row">
                        <div>
                            <div class="field-label">Type</div>
                            <select id="linePreset" class="mini-select" onchange="onLinePresetChange()">
                                <option value="tubular25">Tubular 25 mm</option>
                                <option value="dyneema1">Dyneema 1"</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>

                        <!-- Custom line params (enabled only when Custom is selected) -->
                        <div class="line-custom">
                            <div class="field-label">Stiffness</div>
                            <div class="input-wrap">
                                <input type="number" id="lineEA" class="mini-input" value="150" min="1"
                                       step="10" disabled>
                                <span class="input-unit">kN</span>
                            </div>
                        </div>
                        <div class="line-custom">
                            <div class="field-label">Line weight</div>
                            <div class="input-wrap">
                                <input type="number" id="lineW" class="mini-input" value="70" min="1"
                                       step="1" disabled>
                                <span class="input-unit">g/m</span>
                            </div>
                        </div>
                    </div>

                    <!-- Pre-tension + Walker -->
                    <div class="section-row">
                        <div>
                            <div class="field-label">Pre-tension</div>
                            <div class="input-wrap">
                                <input type="number" id="preTension" class="mini-input" value="8" min="0.1"
                                       step="0.1">
                                <span class="input-unit">kN</span>
                            </div>
                        </div>
                        <div>
                            <div class="field-label">Walker</div>
                            <div class="input-wrap">
                                <input type="number" id="walkerKg" class="mini-input" value="80" min="20" max="300"
                                       step="5">
                                <span class="input-unit">kg</span>
                            </div>
                        </div>
                    </div>

                </div>
            </details>
        </div>

        <!-- Section 4: Buttons + status -->
        <div class="panel-section">
            <div class="btn-row">
                <button id="selectAreaBtn" class="btn-secondary" onclick="toggleSelectArea()">Select area</button>
                <button id="searchBtn" class="btn-primary" onclick="doSearch()" disabled>Search</button>
                <button id="draw-line-btn" title="Draw custom line" onclick="toggleDrawLine()">
                    <span class="material-symbols-rounded"
                          style="font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">draw</span>
                </button>
            </div>

            <div id="status" data-state="idle">Draw a rectangle to begin</div>
        </div>
    </div>

    <!-- Line detail (hidden until click) -->
    <div id="panel-detail-wrap">
        <div id="panel-detail" class="island">
            <div id="detail-content"></div>
        </div>
        <button class="panel-tab" onclick="collapseDetail()" title="Collapse">
            <span class="material-symbols-rounded"
                  style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">chevron_left</span>
        </button>
    </div>

    <!-- Reopen detail tab (shown when panel is collapsed) -->
    <button id="detail-reopen-tab" onclick="reopenDetail()" title="Reopen">
        <span class="material-symbols-rounded"
              style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">chevron_right</span>
    </button>

    <!-- Legend -->
    <div id="legend-wrap">
        <div id="legend" class="island">
            <b>Distance (m)</b>
            <canvas id="legend-bar" height="10"></canvas>
            <div id="legend-labels">
                <span id="leg-min"></span><span id="leg-max"></span>
            </div>
            <div class="legend-water">
                <span class="dash-sample"></span> Water crossing
            </div>
            <div id="slope-legend"
                 style="display:none;margin-top:8px;border-top:1px solid rgba(180,140,90,0.18);padding-top:7px">
                <b>Slope</b>
                <canvas id="slope-bar" height="10"></canvas>
                <div style="display:flex;justify-content:space-between;color:#78716c;font-size:12px">
                    <span id="slope-leg-min">0°</span><span id="slope-leg-max">45°</span>
                </div>
            </div>
            <div id="elev-legend"
                 style="display:none;margin-top:8px;border-top:1px solid rgba(180,140,90,0.18);padding-top:7px">
                <b>Elevation (m)</b>
                <canvas id="elev-bar" height="10"></canvas>
                <div style="display:flex;justify-content:space-between;color:#78716c;font-size:12px">
                    <span id="elev-leg-min">—</span><span id="elev-leg-max">—</span>
                </div>
            </div>
        </div>
        <button class="panel-tab" onclick="hideLegend()" title="Close">
            <span class="material-symbols-rounded"
                  style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">chevron_left</span>
        </button>
    </div>

</div>

<!---- RIGHT COLUMN ---->
<div id="right-col">

    <!-- Layer switcher -->
    <div id="panel-layers">
        <button id="layers-btn" title="Layers">
            <span class="material-symbols-rounded"
                  style="font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">layers</span>
        </button>
        <div id="layers-expanded">
            <div class="panel-title" style="margin-bottom:9px">Base layer</div>
            <div class="layer-grid" id="layer-grid"></div>
            <div class="overlay-section">
                <div class="section-label">Overlays</div>
                <div class="layer-grid">
                    <div class="layer-thumb" id="ov-slope-thumb" onclick="toggleOverlay('slope')">
                        <div class="thumb-img"
                             style="background:linear-gradient(to right,#ffff72,#fd8d3c,#bd0026)"></div>
                        <span>Slope</span>
                        <div class="thumb-check">✓</div>
                    </div>
                    <div class="layer-thumb" id="ov-elev-thumb" onclick="toggleOverlay('elev')">
                        <div class="thumb-img"
                             style="background:linear-gradient(to right,#256670,#427849,#aab55d,#bfa564,#fdface)"></div>
                        <span>Elevation</span>
                        <div class="thumb-check">✓</div>
                    </div>
                    <div class="layer-thumb" id="ov-contour-thumb" onclick="toggleOverlay('contour')">
                        <div class="thumb-img" style="background:#d4b896"></div>
                        <span>Contours</span>
                        <div class="thumb-check">✓</div>
                    </div>
                    <div class="layer-thumb" id="ov-hillshade-thumb" onclick="toggleOverlay('hillshade')">
                        <div class="thumb-img"
                             style="background:linear-gradient(135deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.1) 55%,rgba(0,0,0,0) 100%),#c8bfb0"></div>
                        <span>Hillshade</span>
                        <div class="thumb-check">✓</div>
                    </div>
                    <div class="layer-thumb" id="ov-names-thumb" onclick="toggleOverlay('names')">
                        <div class="thumb-img" style="background:#eae6e0"></div>
                        <span>Names</span>
                        <div class="thumb-check">✓</div>
                    </div>
                    <div class="layer-thumb" id="ov-landuse-thumb" onclick="toggleOverlay('landuse')">
                        <div class="thumb-img"
                             style="background:linear-gradient(135deg,#3a8f4c 0%,#c8b820 40%,#c0522a 70%,#3a73c0 100%)"></div>
                        <span>Land use</span>
                        <div class="thumb-check">✓</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Geolocate -->
    <button id="geolocate-btn" title="Go to my location" onclick="geolocate()">
        <span class="material-symbols-rounded"
              style="font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">my_location</span>
    </button>

    <!-- Zoom combo -->
    <div id="zoom-combo">
        <button class="zoom-btn" title="Zoom in" onclick="map.zoomIn()">
            <span class="material-symbols-rounded"
                  style="font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">add</span>
        </button>
        <button class="zoom-btn" title="Zoom out" onclick="map.zoomOut()">
            <span class="material-symbols-rounded"
                  style="font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">remove</span>
        </button>
    </div>

</div>

<div id="elev-tip"></div>

<!-- CDN scripts — must load synchronously before ES modules -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
